[workspace]
resolver = "2"
members = [
    "crates/salib",
    "crates/salib-cli",
    "crates/salib-core",
    "crates/salib-estimators",
    "crates/salib-models",
    "crates/salib-samplers",
    "crates/salib-shapley",
    "crates/salib-surrogate",
    "crates/salib-validation",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/antimemeai/salib"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
