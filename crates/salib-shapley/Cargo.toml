[package]
name = "salib-shapley"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = """
Shapley effects estimator for global sensitivity analysis
(Song-Nelson-Staum 2016).
"""

[lib]
path = "src/lib.rs"

[dependencies]
salib-core = { version = "0.3.0", path = "../salib-core" }
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
# Cross-crate test fixtures are workspace-only. Path-only dev dependencies are
# omitted from published manifests, avoiding cycles between unpublished releases.
salib-validation = { path = "../salib-validation" }
serde_json = "1"

[lints]
workspace = true
